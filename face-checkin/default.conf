server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # 开启 gzip：首屏 5MB JS 压缩后约 1/4，弱网/内网环境显著提速
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_static on;

    # 人员注册照走 JSON body 直传 base64（canvas 压缩后 100~700KB，含转码放大 ~1.4x）；
    # nginx 默认 client_max_body_size 1m 会在高细节照片上静默 413，前端只显示"保存失败"。
    client_max_body_size 5m;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # prod 构建的 publicPath 是 /wisdom-park/（config/index.js），资源实际在根目录下；
    # 无此映射时 try_files 会把 /wisdom-park/js/xx.js 回落成 index.html，浏览器把
    # HTML 当 JS 执行直接白屏。仅映射存在的文件，其余照旧回落 index.html。
    location /wisdom-park/ {
        alias /usr/share/nginx/html/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location /smartPark/ {
        proxy_pass http://park-gateway:8099/smartPark/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /face-checkin-device/ {
        proxy_pass http://host.docker.internal:9010/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
