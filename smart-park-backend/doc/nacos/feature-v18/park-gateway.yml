#######把ribbon这5行的配置，替换为下面feign部分########
ribbon:
  httpclient:
    enabled: true
  ReadTimeout: 60000
  ConnectTimeout: 60000
#######替换部分########
feign:
  client:
    config:
      default:
        #超时时间默认为1s
        #建立连接所用的时间，适用于网络状况正常的情况下，两端连接所需要的时间
        ConnectTimeOut: 60000
        #指建立连接后从服务端读取到可用资源所用的时间
        ReadTimeOut: 60000