version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: face-checkin-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: smart-park
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_0900_ai_ci
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-sql:/docker-entrypoint-initdb.d
      - ../tmp_photos:/app/tmp_photos
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: face-checkin-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  nacos:
    image: nacos/nacos-server:v2.1.1
    container_name: face-checkin-nacos
    environment:
      MODE: standalone
      JVM_XMS: 256m
      JVM_XMX: 512m
      NACOS_AUTH_ENABLE: "true"
      NACOS_AUTH_TOKEN: "SecretKey012345678901234567890123456789012345678901234567890123456789"
      NACOS_AUTH_IDENTITY_KEY: "serverIdentity"
      NACOS_AUTH_IDENTITY_VALUE: "security"
    ports:
      - "8850:8848"
      - "9850:9848"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8848/nacos/actuator/health"]
      interval: 15s
      timeout: 10s
      retries: 20

  park-gateway:
    build:
      context: ../smart-park-backend
      dockerfile: Dockerfile.gateway
    container_name: face-checkin-gateway
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_DATABASE: "0"
      SPRING_REDIS_PASSWORD: ""
      ALIYUN_SMS_REGIONID: cn-hangzhou
      ALIYUN_SMS_ACCESSKEYID: dummy-access-key
      ALIYUN_SMS_SECRET: dummy-secret
      PARAM_FILTER_WHITE_URI: "/smartPark/park-system/login,/smartPark/park-system/parkManagement/auth/login,/smartPark/park-system/captcha,/smartPark/park-system/actuator,/smartPark/park-system/common/getImgCode,/smartPark/park-meeting/face-checkin/verify"
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: nacos
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: nacos
    ports:
      - "8099:8099"

  park-system:
    build:
      context: ../smart-park-backend
      dockerfile: Dockerfile.system
    container_name: face-checkin-system
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_DATABASE: "0"
      SPRING_REDIS_PASSWORD: ""
      ALIYUN_SMS_REGIONID: cn-hangzhou
      ALIYUN_SMS_ACCESSKEYID: dummy-access-key
      ALIYUN_SMS_SECRET: dummy-secret
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: nacos
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: nacos
    ports:
      - "30010:30010"

  park-meeting:
    build:
      context: ../smart-park-backend
      dockerfile: Dockerfile.meeting
    container_name: face-checkin-meeting
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      face-inference:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_REDIS_DATABASE: "0"
      SPRING_REDIS_PASSWORD: ""
      ALIYUN_SMS_REGIONID: cn-hangzhou
      ALIYUN_SMS_ACCESSKEYID: dummy-access-key
      ALIYUN_SMS_SECRET: dummy-secret
      FACE_CHECKIN_DEVICE_TOKEN: board-token
      FACE_INFERENCE_URL: http://face-inference:8901/match
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR: nacos:8848
      SPRING_CLOUD_NACOS_DISCOVERY_USERNAME: nacos
      SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD: nacos
      SPRING_CLOUD_NACOS_CONFIG_USERNAME: nacos
      SPRING_CLOUD_NACOS_CONFIG_PASSWORD: nacos
    ports:
      - "30011:30011"

  face-inference:
    build:
      context: ../face_match
      dockerfile: Dockerfile
    container_name: face-checkin-inference
    ports:
      - "8901:8901"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8901/health')"]
      interval: 15s
      timeout: 5s
      retries: 10

  face-frontend:
    build:
      context: ../face-checkin
      dockerfile: Dockerfile
    container_name: face-checkin-frontend
    depends_on:
      - park-gateway
    ports:
      - "9001:80"

volumes:
  mysql_data:


