<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="100%" role="img" aria-label="Intelligent Mansion face check-in pixel HUD">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="55%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#140a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffc6"/>
      <stop offset="50%" stop-color="#48b2ff"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <linearGradient id="faceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00ffc6" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#48b2ff" stop-opacity=".95"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#20e8ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- GitHub sanitizer 移除 style 块，全部用内联属性；动画全用 SMIL -->
  <rect width="960" height="280" fill="url(#bg)"/>
  <rect width="960" height="280" fill="url(#grid)"/>

  <g shape-rendering="crispEdges">
    <!-- 顶部/底部霓虹镶边 -->
    <rect x="0" y="0" width="960" height="4" fill="url(#accent)"/>
    <rect x="0" y="276" width="960" height="4" fill="url(#accent)"/>

    <!-- 左侧像素天际线 -->
    <g>
      <rect x="40" y="150" width="20" height="106" fill="#122b41"/>
      <rect x="66" y="118" width="24" height="138" fill="#17334f"/>
      <rect x="96" y="166" width="16" height="90" fill="#102a41"/>
      <rect x="118" y="140" width="18" height="116" fill="#143049"/>
      <rect x="72" y="128" width="5" height="5" fill="#00ffc6"><animate attributeName="opacity" values="1;.2;1" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="82" y="140" width="5" height="5" fill="#ff2e88"><animate attributeName="opacity" values=".2;1;.2" dur="3.1s" repeatCount="indefinite"/></rect>
      <rect x="72" y="152" width="5" height="5" fill="#48b2ff"><animate attributeName="opacity" values="1;.3;1" dur="1.9s" repeatCount="indefinite"/></rect>
      <rect x="82" y="164" width="5" height="5" fill="#ffd166"><animate attributeName="opacity" values=".3;1;.3" dur="2.7s" repeatCount="indefinite"/></rect>
      <rect x="122" y="150" width="5" height="5" fill="#00ffc6"><animate attributeName="opacity" values=".2;1;.2" dur="2.2s" repeatCount="indefinite"/></rect>
      <rect x="122" y="174" width="5" height="5" fill="#48b2ff"><animate attributeName="opacity" values="1;.25;1" dur="3.4s" repeatCount="indefinite"/></rect>
      <rect x="132" y="162" width="5" height="5" fill="#ff2e88"><animate attributeName="opacity" values="1;.3;1" dur="2.9s" repeatCount="indefinite"/></rect>
    </g>

    <!-- 右侧像素天际线 -->
    <g>
      <rect x="802" y="136" width="20" height="120" fill="#143049"/>
      <rect x="828" y="104" width="26" height="152" fill="#17334f"/>
      <rect x="860" y="150" width="18" height="106" fill="#102a41"/>
      <rect x="884" y="122" width="22" height="134" fill="#122b41"/>
      <rect x="834" y="116" width="5" height="5" fill="#00ffc6"><animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/></rect>
      <rect x="844" y="130" width="5" height="5" fill="#ffd166"><animate attributeName="opacity" values=".2;1;.2" dur="2.1s" repeatCount="indefinite"/></rect>
      <rect x="834" y="144" width="5" height="5" fill="#ff2e88"><animate attributeName="opacity" values="1;.3;1" dur="3.3s" repeatCount="indefinite"/></rect>
      <rect x="888" y="134" width="5" height="5" fill="#48b2ff"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" repeatCount="indefinite"/></rect>
      <rect x="898" y="158" width="5" height="5" fill="#00ffc6"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></rect>
      <rect x="888" y="182" width="5" height="5" fill="#ff2e88"><animate attributeName="opacity" values=".25;1;.25" dur="1.7s" repeatCount="indefinite"/></rect>
    </g>

    <!-- 左像素人脸识别框（青色，眨眼 + 内部扫描） -->
    <g transform="translate(0,24)">
      <rect x="176" y="72" width="104" height="104" fill="#071827" stroke="#00ffc6" stroke-width="3"/>
      <rect x="170" y="66" width="14" height="4" fill="#00ffc6"/>
      <rect x="170" y="66" width="4" height="14" fill="#00ffc6"/>
      <rect x="272" y="66" width="14" height="4" fill="#00ffc6"/>
      <rect x="282" y="66" width="4" height="14" fill="#00ffc6"/>
      <rect x="170" y="168" width="4" height="14" fill="#00ffc6"/>
      <rect x="170" y="178" width="14" height="4" fill="#00ffc6"/>
      <rect x="282" y="168" width="4" height="14" fill="#00ffc6"/>
      <rect x="272" y="178" width="14" height="4" fill="#00ffc6"/>
      <rect x="200" y="104" width="16" height="16" fill="url(#faceGrad)">
        <animate attributeName="height" values="16;16;2;16;16" keyTimes="0;.42;.5;.58;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="240" y="104" width="16" height="16" fill="url(#faceGrad)">
        <animate attributeName="height" values="16;16;2;16;16" keyTimes="0;.42;.5;.58;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="204" y="138" width="48" height="6" fill="#ff2e88"/>
      <rect x="179" y="74" width="98" height="4" fill="#00ffc6" opacity=".65">
        <animate attributeName="y" values="100;194;100" dur="2.8s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- 右像素人脸识别框（品红，脉冲眼 + 反向扫描） -->
    <g transform="translate(0,24)">
      <rect x="680" y="72" width="104" height="104" fill="#071827" stroke="#ff2e88" stroke-width="3"/>
      <rect x="674" y="66" width="14" height="4" fill="#ff2e88"/>
      <rect x="674" y="66" width="4" height="14" fill="#ff2e88"/>
      <rect x="776" y="66" width="14" height="4" fill="#ff2e88"/>
      <rect x="786" y="66" width="4" height="14" fill="#ff2e88"/>
      <rect x="674" y="168" width="4" height="14" fill="#ff2e88"/>
      <rect x="674" y="178" width="14" height="4" fill="#ff2e88"/>
      <rect x="786" y="168" width="4" height="14" fill="#ff2e88"/>
      <rect x="776" y="178" width="14" height="4" fill="#ff2e88"/>
      <rect x="704" y="104" width="16" height="16" fill="#ff2e88"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="744" y="104" width="16" height="16" fill="#ff2e88"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></rect>
      <rect x="708" y="138" width="48" height="6" fill="#00ffc6"/>
      <rect x="683" y="74" width="98" height="4" fill="#ff2e88" opacity=".65">
        <animate attributeName="y" values="194;100;194" dur="3.4s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- 中央数据管道：板端→桥接→云，数据包流动 -->
    <g transform="translate(0,8)">
      <rect x="300" y="176" width="360" height="40" fill="#04121e" stroke="#29f7ff" stroke-opacity=".45" stroke-width="2"/>
      <rect x="308" y="188" width="10" height="16" fill="#00ffc6">
        <animate attributeName="x" values="308;646" dur="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="308" y="188" width="10" height="16" fill="#48b2ff">
        <animate attributeName="x" values="308;646" dur="2.4s" begin="0.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="308" y="188" width="10" height="16" fill="#ffd166">
        <animate attributeName="x" values="308;646" dur="2.4s" begin="1.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="360" y="172" width="4" height="48" fill="#29f7ff" opacity=".5"/>
      <rect x="420" y="172" width="4" height="48" fill="#29f7ff" opacity=".5"/>
      <rect x="480" y="172" width="4" height="48" fill="#29f7ff" opacity=".5"/>
      <rect x="540" y="172" width="4" height="48" fill="#29f7ff" opacity=".5"/>
      <rect x="600" y="172" width="4" height="48" fill="#29f7ff" opacity=".5"/>
    </g>

    <!-- 标题（text 内联属性，sanitizer 保留） -->
    <text x="480" y="86" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="40" font-weight="700" letter-spacing="2" fill="url(#accent)">INTELLIGENT MANSION</text>
    <text x="480" y="120" text-anchor="middle" font-family="Consolas,'Courier New',monospace" font-size="14" letter-spacing="4" fill="#8ff3ff" opacity=".85">PIXEL FACE CHECK-IN SYSTEM</text>

    <!-- 底部实时状态灯行 -->
    <g font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2">
      <circle cx="218" cy="244" r="4" fill="#00ffc6"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" repeatCount="indefinite"/></circle>
      <text x="230" y="248" fill="#00ffc6">LINK ONLINE</text>
      <circle cx="372" cy="244" r="4" fill="#48b2ff"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin=".4s" repeatCount="indefinite"/></circle>
      <text x="384" y="248" fill="#48b2ff">K210 STREAM</text>
      <circle cx="534" cy="244" r="4" fill="#ff2e88"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin=".8s" repeatCount="indefinite"/></circle>
      <text x="546" y="248" fill="#ff2e88">SFACE 0.50</text>
      <circle cx="680" cy="244" r="4" fill="#ffd166"><animate attributeName="opacity" values="1;.2;1" dur="1.2s" begin=".2s" repeatCount="indefinite"/></circle>
      <text x="692" y="248" fill="#ffd166">FRONT2BACK</text>
    </g>

    <!-- 左上 LIVE 徽标 -->
    <g font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2">
      <circle cx="28" cy="30" r="4" fill="#00ffc6"><animate attributeName="opacity" values="1;.15;1" dur=".9s" repeatCount="indefinite"/></circle>
      <text x="40" y="34" fill="#00ffc6">LIVE LINK</text>
    </g>
    <!-- 右上分辨率 -->
    <text x="932" y="34" text-anchor="end" font-family="Consolas,'Courier New',monospace" font-size="12" font-weight="700" letter-spacing="2" fill="#ff2e88">320x240 RGB565</text>

    <!-- 全屏扫描线（缓慢下移循环） -->
    <rect x="0" y="0" width="960" height="16" fill="#20e8ff" opacity=".08">
      <animate attributeName="y" values="-16;280" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
