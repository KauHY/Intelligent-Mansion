<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 240" width="960" height="240" role="img" aria-label="Intelligent Mansion face check-in pixel HUD">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/>
      <stop offset="55%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#140a24"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffc6"/>
      <stop offset="50%" stop-color="#48b2ff"/>
      <stop offset="100%" stop-color="#ff2e88"/>
    </linearGradient>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M16 0H0v16" fill="none" stroke="#20e8ff" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    text { font-family: Consolas, "Courier New", monospace; fill: #e9fbff; }
    .title { font-size: 46px; font-weight: 700; letter-spacing: 4px; }
    .sub { font-size: 15px; letter-spacing: 6px; fill: #8ff3ff; opacity: .84; }
    .chip { font-size: 12px; font-weight: 700; letter-spacing: 2px; }
    .scan { animation: scan 4.8s linear infinite; }
    .blink { animation: blink 1.05s steps(1) infinite; }
    .float { animation: float 5.2s ease-in-out infinite; }
    .pulse { animation: pulse 2.2s ease-in-out infinite; }
    .slow { animation: float 8s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(-16px); opacity: 0; } 10% { opacity: .85; } 90% { opacity: .85; } 100% { transform: translateY(236px); opacity: 0; } }
    @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: .18; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
    @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  </style>

  <rect width="960" height="240" fill="url(#bg)"/>
  <rect width="960" height="240" fill="url(#grid)"/>
  <g shape-rendering="crispEdges">
    <rect x="0" y="0" width="960" height="4" fill="url(#accent)"/>
    <rect x="0" y="236" width="960" height="4" fill="url(#accent)"/>
    <g class="float">
      <rect x="48" y="118" width="18" height="82" fill="#122b41"/>
      <rect x="74" y="86" width="22" height="114" fill="#17334f"/>
      <rect x="104" y="134" width="16" height="66" fill="#102a41"/>
      <rect x="78" y="96" width="5" height="5" fill="#00ffc6"/>
      <rect x="88" y="106" width="5" height="5" fill="#ff2e88"/>
      <rect x="78" y="116" width="5" height="5" fill="#48b2ff"/>
      <rect x="88" y="126" width="5" height="5" fill="#ffd166"/>
    </g>
    <g class="slow">
      <rect x="806" y="104" width="20" height="96" fill="#122b41"/>
      <rect x="834" y="74" width="26" height="126" fill="#17334f"/>
      <rect x="868" y="118" width="18" height="82" fill="#102a41"/>
      <rect x="840" y="86" width="5" height="5" fill="#00ffc6"/>
      <rect x="850" y="98" width="5" height="5" fill="#48b2ff"/>
      <rect x="840" y="110" width="5" height="5" fill="#ff2e88"/>
    </g>
    <g class="pulse">
      <rect x="150" y="46" width="88" height="88" fill="#071827" stroke="#00ffc6" stroke-width="3"/>
      <rect x="168" y="74" width="14" height="16" fill="#00ffc6"/>
      <rect x="206" y="74" width="14" height="16" fill="#00ffc6"/>
      <rect x="164" y="104" width="60" height="5" fill="#ff2e88"/>
    </g>
    <g class="blink">
      <rect x="722" y="46" width="88" height="88" fill="#071827" stroke="#ff2e88" stroke-width="3"/>
      <rect x="740" y="74" width="14" height="16" fill="#ff2e88"/>
      <rect x="778" y="74" width="14" height="16" fill="#ff2e88"/>
      <rect x="736" y="104" width="60" height="5" fill="#00ffc6"/>
    </g>
    <rect x="286" y="52" width="390" height="76" fill="#04121e" stroke="#29f7ff" stroke-opacity=".45" stroke-width="2"/>
    <rect x="292" y="58" width="378" height="64" fill="#020c16"/>
    <rect x="304" y="70" width="8" height="8" fill="#00ffc6"/>
    <rect x="320" y="70" width="8" height="8" fill="#48b2ff"/>
    <rect x="336" y="70" width="8" height="8" fill="#ff2e88"/>
    <rect x="306" y="92" width="126" height="7" fill="#22f0ff" opacity=".72"/>
    <rect x="306" y="107" width="220" height="7" fill="#48b2ff" opacity=".58"/>
    <rect x="306" y="122" width="90" height="7" fill="#ff2e88" opacity=".58"/>
    <g class="scan">
      <rect x="0" y="0" width="960" height="18" fill="#20e8ff" opacity=".09"/>
    </g>
  </g>

  <text x="492" y="188" text-anchor="middle" class="title" fill="url(#accent)">INTELLIGENT MANSION</text>
  <text x="492" y="214" text-anchor="middle" class="sub">PIXEL FACE CHECK-IN SYSTEM</text>
  <text x="36" y="32" class="chip" fill="#00ffc6">LIVE LINK</text>
  <circle cx="24" cy="27" r="4" class="blink" fill="#00ffc6"/>
  <text x="924" y="32" text-anchor="end" class="chip" fill="#ff2e88">FRONT2BACK</text>
</svg>
